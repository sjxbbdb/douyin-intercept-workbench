<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  license-server/admin/web/index.html —— 厂商管理后台的骨架。

  ⚠️ 四条不可动摇的前端约束（与 client/ui/index.html 同一立场）：
    1. **原生 DOM，无框架、无构建、无 CDN、无外部字体**。
       后台常常只能经 SSH 隧道访问，机器可能完全离线；任何外部资源
       都会让面板在断网时变成白屏——而它正是用来排障的。
    2. **界面不做任何算术**。所有计数、成功率、百分比与条宽全部来自
       `license-server/admin/api.js`（它再调 `shared/lib/stats.js`）。
       前端只负责"把返回的对象画出来"，包括把 `null` 画成 `—`。
       厂商看板与商家看板必须对同一个口径给出同一个答案。
    3. **零硬编码样例数字**。空态一律"暂无数据"。
       旧代码 D-14 的缺陷就是看板挂着演示假数据。
    4. **所有插值必须转义**。商家备注与失败原因都可能被用户输入污染。

  ⚠️ 会话令牌**不在这个文件里**，也不在 localStorage 里：
     它在 `HttpOnly; SameSite=Strict; Path=<ADMIN_PATH>` 的 cookie 里，
     由服务端设置，JS 读不到。这正是它比 HTTP Basic / 前端存口令安全的地方。
-->
<title>授权中心 · 厂商管理后台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══════════ 登录 ══════════ -->
<div class="login-wrap" id="login-view" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <h1 class="login-title">授权中心 · 管理后台</h1>
    <p class="login-sub">厂商内部使用。所有操作均写入 <span class="mono">admin_action_log</span>。</p>

    <label class="field">
      <span class="field-label">管理员</span>
      <input type="text" id="login-user" name="user" autocomplete="username" required>
    </label>
    <label class="field">
      <span class="field-label">密码</span>
      <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
    </label>

    <button type="submit" class="btn btn-primary" id="login-submit">登录</button>
    <div class="login-msg" id="login-msg" role="alert"></div>

    <p class="login-hint">
      连续失败 5 次会锁定 10 分钟。会话按 <span class="mono">ADMIN_SESSION_TTL_HOURS</span> 过期。
    </p>
  </form>
</div>

<!-- ══════════ 主界面 ══════════ -->
<div id="app-view" hidden>

  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-name">授权中心</span>
        <span class="brand-sub">厂商管理后台</span>
      </div>

      <nav class="tabs" id="tabs" role="tablist" aria-label="功能面板"></nav>

      <div class="topbar-right">
        <span class="who" id="who">—</span>
        <button type="button" class="btn btn-ghost" id="btn-refresh" title="立即刷新当前面板">刷新</button>
        <button type="button" class="btn btn-ghost" id="btn-logout">退出</button>
        <span class="conn" id="conn" data-state="unknown">连接中…</span>
      </div>
    </div>
    <!-- 后台自己的暴露面提示（路径、白名单是否生效）——由 /api/session 给出 -->
    <div class="exposure" id="exposure" hidden></div>
  </header>

  <div class="banner banner-error" id="banner-error" hidden>
    <strong id="banner-error-title">请求失败</strong>
    <span id="banner-error-detail"></span>
  </div>

  <main id="main">
    <section class="panel" id="panel-overview" data-panel="overview" role="tabpanel"></section>
    <section class="panel" id="panel-merchants" data-panel="merchants" role="tabpanel" hidden></section>
    <section class="panel" id="panel-merchant" data-panel="merchant" role="tabpanel" hidden></section>
    <section class="panel" id="panel-forensics" data-panel="forensics" role="tabpanel" hidden></section>
    <section class="panel" id="panel-reconcile" data-panel="reconcile" role="tabpanel" hidden></section>
    <section class="panel" id="panel-system" data-panel="system" role="tabpanel" hidden></section>
  </main>

  <footer class="footer">
    <span>厂商管理后台 · 数据来自授权中心同一份库</span>
    <span class="sep">·</span>
    <span>看板口径由 <span class="mono">shared/lib/stats.js</span> 统一计算，界面不做任何算术</span>
    <span class="sep">·</span>
    <span><button type="button" class="linklike" id="btn-help">口径说明</button></span>
  </footer>
</div>

<div class="overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
