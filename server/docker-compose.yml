services:
  license-server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    environment:
      DB_PATH: /data/license.sqlite
      HOST: 0.0.0.0
      PORT: 18080
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      DRAFT_TIMEOUT_MS: ${DRAFT_TIMEOUT_MS:-30000}
    volumes:
      - license-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  license-data:
