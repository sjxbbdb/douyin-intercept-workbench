<!DOCTYPE html>
<html><head><title>视频页 - 抖音</title></head>
<body>
<div id="app">
  <div id="feed">
    <div data-e2e="feed-comment-icon"></div>
    <div data-e2e="comment-list" data-fixture-visible="0" style="display:none;height:0">
      <div data-e2e="comment-item">
        <div data-e2e="comment-content">隐藏列表里的评论</div>
        <button>回复</button>
      </div>
    </div>
    <div data-e2e="comment-list" data-fixture-visible="1" style="height:600px">
      <div data-e2e="comment-item">
        <div data-e2e="comment-content">这是一条测试评论内容求带</div>
        <button>回复</button>
        <button>展开3条回复</button>
        <span>回复中</span>
        <span contenteditable="true">输入回复内容</span>
      </div>
      <div data-e2e="comment-item">
        <div data-e2e="comment-content">这是第二条测试评论内容</div>
        <span contenteditable="true"></span>
      </div>
      <div data-e2e="comment-item">
        <div data-e2e="comment-content">这是第三条测试评论内容</div>
        <button>回复</button>
      </div>
    </div>
  </div>
  <div class="comment-input-container">
    <div contenteditable="true">发布评论</div>
  </div>
  <div class="danmaku-item"><span>回复</span></div>
  <div class="footer">联系方式 138 0013 8000</div>
  <script>window.__INITIAL_STATE__={"note":"已脱敏"}</script>
</div>
</body></html>
