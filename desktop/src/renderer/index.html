<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>截流自动回复 Agent</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell" data-state="loading">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true">回</span><div><strong>截流 Agent</strong><small>商家工作台</small></div></div>
      <nav id="nav" class="nav-list">
        <button class="nav-item" data-view="agent">Agent</button>
        <button class="nav-item active" data-view="tasks">任务</button>
        <button class="nav-item" data-view="leads">线索</button>
        <button class="nav-item" data-view="logs">回复记录</button>
        <button class="nav-item" data-view="credits">积分</button>
        <button class="nav-item" data-view="settings">设置</button>
      </nav>
      <div class="sidebar-note">Agent 会先判断意向，再按授权中心返回的结果生成回复。</div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div><p class="eyebrow">抖音截流与自动回复</p><h1 id="page-title">任务</h1></div>
        <div class="top-actions"><span id="browser-status" class="status-label">抖音窗口未连接</span><span id="license-status" class="status-label">授权检查中</span><span id="balance" class="balance">积分 --</span><button id="refresh" class="icon-button" aria-label="刷新授权状态">刷新</button></div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
